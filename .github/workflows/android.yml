name: Build Android (signed release)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run bundle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npx cap sync android
      - run: chmod +x android/gradlew

      # Signed AAB (upload this to Google Play) + signed APK (for sideload testing)
      - run: cd android && ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload AAB (for Play)
        uses: actions/upload-artifact@v4
        with:
          name: Voltaji-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: Voltaji-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
